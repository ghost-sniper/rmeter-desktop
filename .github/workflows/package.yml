name: Package desktop app

on:
  push:
    # Populate default-branch caches so subsequent release tags can restore them.
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }} x86_64
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
      BUILD_PACKAGES: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Prepare minimal Windows Rust toolchain
        if: runner.os == 'Windows'
        id: rust-dist
        shell: pwsh
        run: |
          # Profiles only affect new installations. Trim unused preinstalled components
          # so updating stable does not also update formatters or other target libraries.
          $installed = @(rustup component list --toolchain stable --installed)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the preinstalled toolchain.' }
          $extras = @($installed | Where-Object { $_ -match '^(clippy|rustfmt|rust-docs)(-|$)' })
          if ($extras.Count -gt 0) {
            rustup component remove --toolchain stable @extras
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove unused toolchain components.' }
          }
          $targets = @(rustup target list --toolchain stable --installed)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect Rust targets.' }
          $extraTargets = @($targets | Where-Object { $_ -ne $env:TARGET })
          if ($extraTargets.Count -gt 0) {
            rustup target remove --toolchain stable @extraTargets
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove unused Rust targets.' }
          }
          $toolchainRoot = (rustup show home).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate rustup.' }
          $checksumPath = Join-Path $env:RUNNER_TEMP 'rust-stable.sha256'
          Invoke-WebRequest 'https://static.rust-lang.org/dist/channel-rust-stable.toml.sha256' -OutFile $checksumPath -MaximumRetryCount 3 -RetryIntervalSec 2 -TimeoutSec 30
          $checksum = Get-Content -LiteralPath $checksumPath -Raw
          $digest = ($checksum.Trim() -split '\s+')[0]
          if ($digest -notmatch '^[0-9a-f]{64}$') { throw 'Invalid stable manifest checksum.' }
          "root=$toolchainRoot" >> $env:GITHUB_OUTPUT
          "key=rustup-minimal-v1-$env:TARGET-$digest" >> $env:GITHUB_OUTPUT

      - name: Cache Windows Rust toolchain
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.rust-dist.outputs.root }}/toolchains/stable-x86_64-pc-windows-msvc
            ${{ steps.rust-dist.outputs.root }}/update-hashes/stable-x86_64-pc-windows-msvc
          # No fallback: rustup still checks stable after restoring this exact release.
          key: ${{ steps.rust-dist.outputs.key }}

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          targets: ${{ matrix.target }}

      - name: Read worker revision and desktop profile
        id: worker
        run: |
          bun -e '
            const manifest = Bun.TOML.parse(await Bun.file("src-tauri/Cargo.toml").text());
            const { git, rev } = manifest.dependencies.rmeter;
            if (!git || !/^[0-9a-f]{40}$/.test(rev)) throw new Error("Invalid pinned rmeter revision");
            const { appendFileSync } = await import("node:fs");
            const { createHash } = await import("node:crypto");
            appendFileSync(process.env.GITHUB_OUTPUT, `rev=${rev}\nrepo=${createHash("sha256").update(git).digest("hex")}\n`);
            const profile = createHash("sha256").update(JSON.stringify(manifest.profile ?? {})).digest("hex");
            appendFileSync(process.env.GITHUB_OUTPUT, `profile=${profile}\n`);
          '

      - name: Cache Cargo dependencies and desktop build
        id: desktop-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Keep the profile in the restore prefix, not just the manifest hash.
          # Otherwise a Thin LTO build restores and re-saves obsolete Fat LTO artifacts.
          shared-key: desktop-${{ matrix.target }}-${{ steps.worker.outputs.profile }}
          # Toolchains come from rust-toolchain; the worker has its own exact cache.
          cache-bin: false

      - name: Cache unpacked Windows Cargo sources and index
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          # rust-cache removes most unpacked sources and registry config.json.
          # Save them before its cleanup to avoid thousands of per-crate file writes.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: cargo-sources-v1-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache matching worker executable
        id: worker-binary
        uses: actions/cache@v6
        with:
          path: .cache/worker/${{ steps.worker.outputs.rev }}/${{ matrix.target }}/bin
          # No fallback: only an executable from this exact core/config is valid.
          key: worker-bin-v1-${{ runner.os }}-${{ matrix.target }}-${{ steps.toolchain.outputs.cachekey }}-${{ steps.worker.outputs.repo }}-${{ steps.worker.outputs.rev }}-${{ hashFiles('scripts/prepare-worker.ts', '.cargo/config.toml') }}-o3

      - name: Cache shared worker compilation
        if: steps.worker-binary.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: .cache/worker-target/${{ matrix.target }}
          key: worker-build-v1-${{ runner.os }}-${{ matrix.target }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('scripts/prepare-worker.ts', '.cargo/config.toml') }}-o3-${{ steps.worker.outputs.repo }}-${{ steps.worker.outputs.rev }}
          # Reuse dependencies across core revisions; Cargo validates fingerprints.
          restore-keys: |
            worker-build-v1-${{ runner.os }}-${{ matrix.target }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('scripts/prepare-worker.ts', '.cargo/config.toml') }}-o3-${{ steps.worker.outputs.repo }}-

      - name: Resolve Linux system dependencies
        id: apt
        if: runner.os == 'Linux'
        run: |
          packages=(libwebkit2gtk-4.1-dev libdbus-1-dev libssl-dev)
          if [[ "$BUILD_PACKAGES" == 'true' ]]; then
            packages+=(rpm)
          fi
          # Keep package indexes fresh, but omit translations and optional desktop services.
          started=$SECONDS
          sudo apt-get -o Acquire::Languages=none update
          update_seconds=$((SECONDS - started))
          # Key downloaded .debs by the exact transaction (URLs, versions and checksums).
          # Resolving after update keeps security updates visible on every run.
          mkdir -p "$RUNNER_TEMP/rmeter-apt"
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/rmeter-apt" -qq --print-uris install -y --no-install-recommends "${packages[@]}" > "$RUNNER_TEMP/apt-plan.txt"
          cat "$RUNNER_TEMP/apt-plan.txt"
          digest=$(LC_ALL=C sort "$RUNNER_TEMP/apt-plan.txt" | sha256sum | cut -d ' ' -f 1)
          echo "key=apt-debs-v1-${RUNNER_OS}-${RUNNER_ARCH}-${digest}" >> "$GITHUB_OUTPUT"
          printf 'APT index update: %ss\n' "$update_seconds"
          printf 'Linux apt index update: **%ss**.\n' "$update_seconds" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Linux dependency downloads
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          # Cache archives only; dpkg still installs and verifies them normally.
          # Exclude root-owned partial downloads, locks and installed system files.
          path: ${{ runner.temp }}/rmeter-apt/*.deb
          key: ${{ steps.apt.outputs.key }}

      - name: Install Linux build and package tools
        if: runner.os == 'Linux'
        run: |
          packages=(libwebkit2gtk-4.1-dev libdbus-1-dev libssl-dev)
          if [[ "$BUILD_PACKAGES" == 'true' ]]; then
            packages+=(rpm)
          fi
          mkdir -p "$RUNNER_TEMP/rmeter-apt"
          started=$SECONDS
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/rmeter-apt" install -y --no-install-recommends "${packages[@]}"
          install_seconds=$((SECONDS - started))
          printf 'APT package installation: %ss\n' "$install_seconds"
          printf 'Linux apt package installation: **%ss**.\n' "$install_seconds" >> "$GITHUB_STEP_SUMMARY"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check cached Windows Cargo dependencies offline
        if: runner.os == 'Windows' && steps.desktop-cache.outputs.cache-hit == 'true' && steps.worker-binary.outputs.cache-hit == 'true'
        run: |
          # An exact build cache can omit source trees; fetch unpacks cached archives.
          # Verify completeness before disabling network access for the actual build.
          started=$SECONDS
          if cargo fetch --manifest-path src-tauri/Cargo.toml --target "$TARGET" --locked --offline; then
            echo 'CARGO_NET_OFFLINE=true' >> "$GITHUB_ENV"
            result='complete; build will use offline dependencies'
          else
            result='incomplete; build will fetch missing dependencies online'
          fi
          printf 'Cargo cache preparation: %ss (%s).\n' "$((SECONDS - started))" "$result"
          printf 'Windows Cargo cache preparation: **%ss** (%s).\n' "$((SECONDS - started))" "$result" >> "$GITHUB_STEP_SUMMARY"

      - name: Build desktop app and requested packages
        if: env.BUILD_PACKAGES == 'true'
        # Tauri's beforeBuildCommand also builds the worker from the pinned rmeter revision.
        run: bun run tauri build --target "$TARGET" --bundles "$BUNDLES" -- --locked --timings

      - name: Build executables and warm main branch caches
        if: env.BUILD_PACKAGES != 'true'
        run: bun run tauri build --target "$TARGET" --no-bundle -- --locked --timings

      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ matrix.platform }}-${{ github.run_attempt }}
          path: src-tauri/target/cargo-timings/cargo-timing.html
          retention-days: 7
          if-no-files-found: warn

      - name: Stage Windows portable binaries and verify installer
        if: env.BUILD_PACKAGES == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = "src-tauri/target/$env:TARGET/release"
          New-Item -ItemType Directory -Path portable
          Copy-Item "$output/rmeter-desktop.exe" portable/
          Copy-Item "src-tauri/binaries/rmeter-js-worker-$env:TARGET.exe" portable/rmeter-js-worker.exe

          $installers = @(Get-ChildItem "$output/bundle/nsis" -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer.' }
          $listing = & "$env:ProgramFiles/7-Zip/7z.exe" l -slt ($installers[0].FullName)
          if ($LASTEXITCODE -ne 0 -or -not ($listing | Select-String -Quiet -Pattern '^Path = (.*[\\/])?rmeter-js-worker\.exe$')) {
            throw 'Could not verify rmeter-js-worker.exe inside the NSIS installer.'
          }

      - name: Verify Linux packages contain the worker
        if: env.BUILD_PACKAGES == 'true' && runner.os == 'Linux'
        run: |
          bundle="src-tauri/target/$TARGET/release/bundle"
          deb=("$bundle"/deb/*.deb)
          rpm=("$bundle"/rpm/*.rpm)
          dpkg-deb --fsys-tarfile "${deb[0]}" | tar -tf - | grep -Ex '(\./)?usr/bin/rmeter-js-worker'
          rpm -qpl "${rpm[0]}" | grep -Fx '/usr/bin/rmeter-js-worker'

      - name: Upload Windows portable app
        if: env.BUILD_PACKAGES == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: rmeter-desktop-windows-x86_64-portable
          path: portable/
          if-no-files-found: error

      - name: Upload Windows NSIS installer
        if: env.BUILD_PACKAGES == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          archive: false
          if-no-files-found: error

      - name: Upload Linux RPM package
        if: env.BUILD_PACKAGES == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          archive: false
          if-no-files-found: error

      - name: Upload Linux DEB package
        if: env.BUILD_PACKAGES == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          archive: false
          if-no-files-found: error
