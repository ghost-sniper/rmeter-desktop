[package]
name = "rmeter-desktop"
version = "0.1.1"
description = "A desktop test plan editor powered by rmeter"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rmeter_desktop_lib"
# Desktop binaries only need the Rust library; avoid unused static/DLL outputs.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rmeter = { git = "https://github.com/ghost-sniper/rmeter.git", rev = "71dacf95889c9cd8a5b252bc36685b615d5e0eac", default-features = false }
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "rt"] }
tempfile = "3"
fontdb = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# O3 / Thin LTO / 8 balances rebuild time and runtime cost; see README benchmarks.
[profile.release]
codegen-units = 8
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
